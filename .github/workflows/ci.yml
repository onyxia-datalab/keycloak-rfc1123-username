name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  build:
    name: Build baseline artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Check formatting and run unit tests
        run: mvn --batch-mode --no-transfer-progress spotless:check clean verify

      - name: Verify provider artifact
        run: scripts/verify-artifact.sh

      - name: Collect immutable test artifact
        run: |
          mkdir dist
          cp target/keycloak-rfc1123-username.jar dist/
          cp target/keycloak-rfc1123-username.cdx.json dist/
          cd dist
          sha256sum keycloak-rfc1123-username.jar > keycloak-rfc1123-username.jar.sha256

      - name: Upload provider artifact
        uses: actions/upload-artifact@v7
        with:
          name: provider-baseline
          path: dist/
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Keycloak ${{ matrix.keycloak-version }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        keycloak-version:
          - 24.0.5
          - 25.0.6
          - 26.7.4

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-read-only: true

      - name: Download baseline artifact
        uses: actions/download-artifact@v8
        with:
          name: provider-baseline
          path: dist

      - name: Verify downloaded artifact checksum
        working-directory: dist
        run: sha256sum --check keycloak-rfc1123-username.jar.sha256

      - name: Run real-server integration suite
        run: scripts/integration-test.sh "${{ matrix.keycloak-version }}" dist/keycloak-rfc1123-username.jar

      - name: Run PostgreSQL multi-node suite
        run: scripts/multi-node-integration-test.sh "${{ matrix.keycloak-version }}" dist/keycloak-rfc1123-username.jar

  data-lifecycle:
    name: Upgrade, restore, and existing-assignment import
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-read-only: true

      - name: Download baseline artifact
        uses: actions/download-artifact@v8
        with:
          name: provider-baseline
          path: dist

      - name: Verify downloaded artifact checksum
        working-directory: dist
        run: sha256sum --check keycloak-rfc1123-username.jar.sha256

      - name: Run data-lifecycle suite
        run: >-
          scripts/data-lifecycle-integration-test.sh
          24.0.5
          26.7.4
          dist/keycloak-rfc1123-username.jar

  kubernetes:
    name: Kubernetes initContainer deployment
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-read-only: true

      - name: Download baseline artifact
        uses: actions/download-artifact@v8
        with:
          name: provider-baseline
          path: dist

      - name: Verify downloaded artifact checksum
        working-directory: dist
        run: sha256sum --check keycloak-rfc1123-username.jar.sha256

      - name: Install Kind
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
          printf '%s  %s\n' "$KIND_SHA256" kind | sha256sum --check
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Run Kubernetes deployment suite
        run: scripts/kubernetes-integration-test.sh dist/keycloak-rfc1123-username.jar
