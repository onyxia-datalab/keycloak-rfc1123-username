name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build analyzed sources
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          # Keycloak 24.0.5 is the binary-compatibility compile baseline. These
          # dependencies have provided scope and are not packaged in the provider
          # JAR. Runtime Keycloak security remains the server operator's concern.
          # Keep this list advisory-specific so every new finding still fails CI.
          allow-ghsas: >-
            GHSA-x4p7-7chp-64hq,
            GHSA-v4jw-m6rm-399h,
            GHSA-q35r-vvhv-vx5h,
            GHSA-rr5q-3xwr-f323,
            GHSA-4q93-v92x-p89f
