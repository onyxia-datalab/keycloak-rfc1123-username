name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Publish release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tag must be vMAJOR.MINOR.PATCH: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build release artifact
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Drevision="$RELEASE_VERSION"
          spotless:check clean verify

      - name: Verify provider artifact
        run: scripts/verify-artifact.sh

      - name: Assemble release files
        run: |
          mkdir dist
          cp target/keycloak-rfc1123-username.jar dist/
          cp target/keycloak-rfc1123-username.cdx.json dist/
          cd dist
          sha256sum keycloak-rfc1123-username.jar > keycloak-rfc1123-username.jar.sha256
          sha256sum keycloak-rfc1123-username.cdx.json > keycloak-rfc1123-username.cdx.json.sha256

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/keycloak-rfc1123-username.jar
            dist/keycloak-rfc1123-username.cdx.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/keycloak-rfc1123-username.jar
          dist/keycloak-rfc1123-username.jar.sha256
          dist/keycloak-rfc1123-username.cdx.json
          dist/keycloak-rfc1123-username.cdx.json.sha256
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
